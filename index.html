<html lang="ru"><head><meta charset="utf-8">

<style>
:root{color-scheme:dark;--bg:#0e1110;--cd:#171c19;--tx:#ecefea;--mu:#8d9892;--ac:#e0618c;--ac2:#1f2622;--ln:#262d29;--g:#6fc283;--y:#e6b440;--r:#e0618c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3,.ser{font-family:Georgia,"Times New Roman",serif;font-weight:700}
header{padding:18px 16px 6px}h1{margin:0;font-size:26px;line-height:1.15}
.sub{color:var(--mu);font-size:14px;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:4px 16px}
.card{display:flex;gap:12px;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.em{font-size:34px;width:54px;height:54px;border-radius:12px;background:var(--ac2);display:grid;place-items:center;flex:none}
.ci{flex:1;min-width:0}.ci b{display:block;font-size:17px}
.mu{color:var(--mu);font-size:13px}
.tag{border:2px solid;border-radius:8px;padding:4px 8px;text-align:center;line-height:1.1;flex:none}
.tag b{font-size:17px;display:block}.tag small{font-size:11px}
.c0{color:var(--g)}.c1{color:var(--y)}.c2{color:var(--r)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0 8px;font-size:12px}
nav button span{display:block;font-size:22px}nav button.on{color:var(--ac);font-weight:600}
.bd{background:var(--ac);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;vertical-align:top}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10}
#sh{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
#sh h2{margin:0 0 4px;font-size:23px}
.x{float:right;border:0;background:var(--ln);color:var(--tx);width:34px;height:34px;border-radius:17px;font-size:18px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row span:last-child{color:var(--mu);white-space:nowrap;text-align:right}
h3{font-size:18px;margin:18px 0 4px}
ol{padding-left:20px;margin:6px 0}ol li{margin:6px 0}
.st{display:flex;align-items:center;gap:12px;margin:12px 0}
.st button{width:38px;height:38px;border-radius:19px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font-size:20px}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-top:10px}
.btn{width:100%;border:0;background:var(--ac);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:600;margin-top:14px}
.btn.o{background:none;border:1px solid var(--ln);color:var(--mu)}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.it input{width:22px;height:22px;accent-color:var(--ac)}.it div{flex:1}.it.dn div{text-decoration:line-through;color:var(--mu)}
.tot{display:flex;justify-content:space-between;font-size:19px;padding:14px 0}
.rc{display:inline-block;background:var(--ac2);border-radius:14px;padding:4px 10px;margin:3px 4px 3px 0;font-size:13px}
.emp{text-align:center;color:var(--mu);padding:40px 10px}

#fl{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 16px 0}
#qi{width:100%;border:0;background:var(--cd);color:var(--tx);border-radius:12px;padding:12px 14px;font-size:16px;outline:0}
#qi:focus{box-shadow:0 0 0 2px var(--ac)}
#fl .chips{padding:8px 0 0}.chip{border:0;padding:7px 13px;font-size:14px}
header{padding:14px 16px 0}h1{font-size:24px}
.cnt{margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.cd{min-width:0}.cd b{display:block;margin:7px 0 2px;font-size:15px;line-height:1.25}
.ph{position:relative;aspect-ratio:4/3;border-radius:14px;background:var(--ac2) center/cover;display:grid;place-items:center;font-size:44px;overflow:hidden}
.ph.has span{display:none}
.mt{display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:6px}
.hero{aspect-ratio:auto;height:210px;margin:-16px -16px 14px;border-radius:20px 20px 0 0;font-size:72px}
.x{position:absolute;top:12px;right:12px;float:none;background:rgba(0,0,0,.5);color:#fff}

:root{--bg:#0a0b0f;--cd:rgba(255,255,255,.055);--tx:#f4efe4;--mu:#a49f93;--ac:#d9b872;--ac2:rgba(217,184,114,.07);--ln:rgba(255,255,255,.12);--gold:linear-gradient(135deg,#f0d9a0,#b8964f)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 38% at 12% 0,rgba(217,184,114,.2),transparent),radial-gradient(55% 40% at 100% 28%,rgba(140,70,120,.24),transparent),radial-gradient(60% 40% at 0 100%,rgba(40,95,115,.22),transparent)}
h1,h2,h3,.cd b{font-family:"Bodoni 72",Didot,"Playfair Display",Georgia,serif}
h1{font-weight:400;font-size:30px;letter-spacing:.02em;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
#fl{background:rgba(10,11,15,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--ln);padding-bottom:8px}
#qi,.chip,.cd,.box,nav{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#qi,.chip{background:var(--cd);border:1px solid var(--ln);color:var(--tx)}
.chip.on{background:var(--gold);color:#1a1408;border-color:transparent;font-weight:600}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:8px 8px 11px;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.cd b,.mt{padding:0 3px}.ph{border-radius:14px}
.box{background:var(--cd);border:1px solid var(--ln)}
nav{background:rgba(16,18,24,.6);border-top:1px solid var(--ln)}
.bd,.btn{background:var(--gold);color:#1a1408}.btn.o{background:none;color:var(--mu)}
#ov{background:rgba(5,6,9,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#sh{background:rgba(20,22,30,.78);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%);border-top:1px solid rgba(217,184,114,.45)}
</style></head><body>
<header><h1>Что приготовить</h1><div class="sub">Рецепты с граммовкой и ценами по Минску</div></header>
<div id="fl"><input id="qi" type="search" placeholder="Найти блюдо" oninput="sq=this.value.trim().toLowerCase();draw()"><div id="ch"></div></div><main id="mn"></main>

<script>
const P={chick:['Куриное филе',17,'кг'],mince:['Фарш свино-говяжий',14,'кг'],pork:['Свиная шея',16.5,'кг'],beef:['Говядина (лопатка)',35,'кг'],trout:['Форель',40,'кг'],pot:['Картофель',2,'кг'],onion:['Лук репчатый',1.5,'кг'],carr:['Морковь',1.6,'кг'],cab:['Капуста',1.3,'кг'],beet:['Свёкла',1.5,'кг'],tom:['Помидоры',5,'кг'],cuc:['Огурцы',4.5,'кг'],pep:['Перец болгарский',9,'кг'],garl:['Чеснок',14,'кг'],lem:['Лимон',9,'кг'],dill:['Зелень (укроп, петрушка)',15,'кг'],pasta:['Макароны',3.5,'кг'],buck:['Гречка',4,'кг'],oat:['Овсяные хлопья',3,'кг'],egg:['Яйца',0.45,'шт'],milk:['Молоко',2.5,'л'],sc:['Сметана 20%',8,'кг'],cream:['Сливки 20%',12,'л'],butter:['Масло сливочное',18,'кг'],cheese:['Сыр',25,'кг'],cott:['Творог',11,'кг'],flour:['Мука',2.2,'кг'],oil:['Масло подсолнечное',5,'л'],sugar:['Сахар',2.8,'кг'],tp:['Томатная паста',9,'кг'],bread:['Хлеб белый',5,'кг'],must:['Горчица',12,'кг'],rice:['Рис',4.5,'кг'],thigh:['Куриные бёдра',9,'кг'],kefir:['Кефир',2.8,'л'],sausage:['Колбаса варёная',12,'кг'],zuc:['Кабачки',3.5,'кг'],bacon:['Бекон',22,'кг'],mush:['Шампиньоны',14,'кг'],salm:['Лосось',50,'кг'],ribs:['Свиные рёбрышки',16,'кг'],pelm:['Пельмени замороженные',11,'кг'],peasd:['Горох сухой',4,'кг'],mil:['Пшено',3,'кг'],apple:['Яблоки',4,'кг'],banana:['Бананы',5.5,'кг'],berry:['Ягоды замороженные',14,'кг'],cocoa:['Какао',35,'кг'],choc:['Шоколад',28,'кг'],honey:['Мёд',25,'кг'],jam:['Варенье',11,'кг'],nuts:['Орехи',35,'кг'],yog:['Йогурт натуральный',5,'кг'],cauli:['Цветная капуста',6,'кг'],eggp:['Баклажаны',6,'кг'],pump:['Тыква',2,'кг'],corn:['Кукуруза консервированная',8,'кг'],peas:['Зелёный горошек',7,'кг'],beans:['Фасоль консервированная',9,'кг'],lent:['Чечевица',6,'кг'],chickp:['Нут',6,'кг'],ham:['Ветчина',20,'кг'],tuna:['Тунец консервированный',25,'кг'],herr:['Сельдь слабосолёная',14,'кг'],turk:['Филе индейки',20,'кг'],liver:['Печень куриная',8,'кг'],saukr:['Квашеная капуста',4,'кг'],pick:['Огурцы солёные',6,'кг'],lav:['Лаваш',8,'кг'],semol:['Манка',3,'кг'],puff:['Слоёное тесто',12,'кг'],cond:['Сгущёнка',11,'кг'],icecr:['Мороженое пломбир',14,'кг'],soy:['Соевый соус',15,'л'],fish:['Филе белой рыбы',14,'кг'],cook:['Печенье',8,'кг']};
const R=[
{id:1,n:'Овсяная каша на молоке',e:'🥣',m:'b',t:10,i:[['oat',80],['milk',300],['butter',10],['sugar',10]],s:['Доведите молоко до кипения.','Всыпьте хлопья, варите 5–7 минут на слабом огне, помешивая.','Добавьте сахар и масло, накройте крышкой на 3 минуты.'],k:'Молоко пополам с водой меньше пригорает. Щепотка соли обязательна.'},
{id:2,n:'Омлет с сыром',e:'🍳',m:'b',t:10,i:[['egg',4],['milk',100],['cheese',40],['butter',10]],s:['Взбейте яйца с молоком и солью вилкой, не миксером: омлет не осядет.','Сыр натрите на мелкой тёрке и добавьте в смесь.','Растопите масло на сковороде, влейте смесь.','Готовьте под крышкой на слабом огне 6–8 минут.'],k:'Чем слабее огонь, тем пышнее омлет.'},
{id:3,n:'Сырники',e:'🧀',m:'b',t:25,i:[['cott',400],['egg',1],['flour',80],['sugar',30],['oil',40]],s:['Разомните творог вилкой, смешайте с яйцом, сахаром и 40 г муки.','Сформируйте шайбы, обваляйте в оставшейся муке.','Жарьте на среднем огне по 3 минуты с каждой стороны.'],k:'Берите сухой творог (5–9%). Если влажный, отожмите его в марле, иначе сырники расплывутся.',x:{n:'Сметанный соус',i:[['sc',80],['sugar',10]],s:'Смешайте сметану с сахаром и подавайте к тёплым сырникам.'}},
{id:4,n:'Драники',e:'🥔',m:'bld',t:35,i:[['pot',600],['onion',80],['egg',1],['flour',30],['oil',60]],s:['Картофель и лук натрите на мелкой тёрке, слейте сок.','Добавьте яйцо, муку и соль, перемешайте.','Жарьте на разогретом масле по 3–4 минуты с каждой стороны до корочки.'],k:'Не оставляйте тесто стоять: картофель темнеет. Лук замедляет потемнение.',x:{n:'Чесночная сметана',i:[['sc',100],['garl',10],['dill',10]],s:'Измельчите чеснок и зелень, смешайте со сметаной и солью.'}},
{id:5,n:'Борщ с говядиной',e:'🍲',m:'l',t:90,i:[['beef',250],['beet',150],['cab',200],['pot',200],['carr',80],['onion',80],['tp',30],['garl',10],['oil',20],['sc',60]],s:['Залейте мясо 1,5 л холодной воды, варите 60 минут, снимая пену.','Свёклу натрите и тушите с томатной пастой и каплей лимонного сока 10 минут.','Добавьте в бульон картофель кубиками, через 10 минут капусту.','Обжарьте лук с морковью и добавьте в кастрюлю.','Положите свёклу, варите 5–7 минут, добавьте чеснок и настаивайте 15 минут. Подавайте со сметаной.'],k:'Кислота сохраняет яркий цвет свёклы. На следующий день борщ вкуснее.'},
{id:6,n:'Гречка с курицей и овощами',e:'🥘',m:'ld',t:35,i:[['buck',150],['chick',300],['onion',80],['carr',80],['pep',100],['oil',30]],s:['Нарежьте курицу кубиками, обжарьте до золотистого цвета 5–6 минут.','Добавьте лук, морковь и перец, тушите 5 минут.','Всыпьте промытую гречку, залейте 300 мл воды, посолите.','Варите под крышкой 15 минут на слабом огне и оставьте на 5 минут.'],k:'Не помешивайте гречку во время варки: будет рассыпчатой.',x:{n:'Томатно-сметанный соус',i:[['sc',60],['tp',20]],s:'Смешайте сметану с томатной пастой и щепоткой соли.'}},
{id:7,n:'Куриные котлеты с пюре',e:'🍗',m:'ld',t:50,i:[['chick',400],['onion',60],['egg',1],['bread',40],['milk',140],['oil',30],['pot',500],['butter',20]],s:['Измельчите филе и лук блендером или в мясорубке.','Замочите хлеб в 40 мл молока, добавьте к фаршу с яйцом, солью и перцем.','Обжарьте котлеты по 3 минуты с каждой стороны, затем 12 минут под крышкой на слабом огне.','Сварите картофель 20 минут, слейте воду, разомните с маслом и тёплым молоком (100 мл).'],k:'Слегка отбейте фарш о стенки миски: котлеты не развалятся.',x:{n:'Сливочный соус',i:[['cream',150],['butter',10],['flour',10],['garl',5]],s:'Обжарьте муку на масле 1 минуту, влейте сливки, добавьте чеснок и прогрейте 3–4 минуты до густоты.'}},
{id:8,n:'Паста болоньезе',e:'🍝',m:'ld',t:40,i:[['pasta',200],['mince',300],['onion',80],['carr',60],['tp',40],['garl',10],['oil',20],['cheese',30]],s:['Мелко нарежьте лук и морковь, обжарьте 5 минут.','Добавьте фарш, жарьте 10 минут, разбивая комочки.','Добавьте томатную пасту, чеснок и 100 мл воды, тушите 15 минут.','Отварите пасту в подсоленной воде (1 л на 100 г) на минуту меньше, чем указано на упаковке.','Смешайте с соусом и посыпьте тёртым сыром.'],k:'Оставьте полстакана воды от пасты: она помогает связать соус.'},
{id:9,n:'Запечённая форель с картофелем',e:'🐟',m:'d',t:40,i:[['trout',400],['pot',500],['lem',40],['oil',20],['butter',10],['dill',10]],s:['Нарежьте картофель дольками, посолите, смешайте с маслом и запекайте 15 минут при 200 °C.','Рыбу посолите, сбрызните лимоном, уложите на картофель с кусочками масла и зеленью.','Запекайте ещё 15–18 минут.'],k:'Рыба готова, когда мякоть легко делится на волокна. Не пересушивайте.',x:{n:'Сливочно-чесночный соус',i:[['cream',100],['garl',8],['dill',5],['lem',20]],s:'Прогрейте сливки с чесноком 3 минуты, добавьте зелень и лимонный сок, посолите.'}},
{id:10,n:'Свиная отбивная с овощами',e:'🥩',m:'d',t:35,i:[['pork',400],['egg',1],['flour',40],['oil',50],['cab',200],['cuc',150],['tom',150]],s:['Нарежьте мясо порциями толщиной 1,5 см, отбейте, посолите и поперчите.','Обмакните в яйцо, затем в муку.','Жарьте на горячей сковороде по 4–5 минут с каждой стороны до полной готовности.','Дайте мясу отдохнуть 3 минуты. Нарежьте овощи салатом и заправьте солью.'],k:'Свинину готовьте полностью: внутри не менее 70 °C, сок прозрачный.',x:{n:'Горчично-сметанный соус',i:[['sc',80],['must',15],['garl',5]],s:'Смешайте сметану, горчицу и измельчённый чеснок.'}},
{id:11,n:'Тушёная говядина с картошкой',e:'🫕',m:'ld',t:120,i:[['beef',450],['pot',500],['onion',100],['carr',100],['tp',30],['garl',10],['oil',30],['sc',80]],s:['Нарежьте говядину кубиками 3 см и обжарьте порциями до корочки.','Добавьте лук и морковь, обжарьте 5 минут, всыпьте томатную пасту.','Залейте горячей водой до покрытия и тушите под крышкой 60–70 минут.','Добавьте картофель, тушите ещё 25 минут, в конце положите чеснок и лавровый лист. Подавайте со сметаной.'],k:'Жёсткая говядина становится мягкой только на самом слабом огне и со временем.'},
{id:12,n:'Блины',e:'🥞',m:'b',t:30,w:'Блины',i:'milk 500,egg 2,flour 200,sugar 20,oil 40,sc 100',s:'Взбейте яйца с сахаром и солью, влейте половину молока.|Всыпьте муку, размешайте без комков, добавьте остальное молоко и 20 мл масла.|Дайте тесту постоять 15 минут, жарьте по минуте с каждой стороны. Подавайте со сметаной.',k:'Тесто должно быть как жидкая сметана.'},
{id:13,n:'Шакшука',e:'🍳',m:'bl',t:25,w:'Шакшука',i:'egg 4,tom 400,pep 100,onion 80,garl 10,oil 20,bread 80',s:'Обжарьте лук и перец 5 минут, добавьте чеснок.|Добавьте нарезанные помидоры, тушите 10 минут, посолите.|Сделайте углубления, вбейте яйца, накройте крышкой на 5–7 минут. Подавайте с хлебом.',k:'Снимайте с огня, когда белок схватился, а желток жидкий.'},
{id:14,n:'Творожная запеканка',e:'🍰',m:'b',t:45,w:'Творожная_запеканка',i:'cott 500,egg 2,sugar 50,flour 40,butter 20,sc 80',s:'Разотрите творог с яйцами, сахаром и мукой.|Выложите в смазанную маслом форму.|Запекайте 35 минут при 180 °C, подавайте со сметаной.'},
